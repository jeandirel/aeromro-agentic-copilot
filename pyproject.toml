[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aeromro-agentic-copilot"
version = "0.4.0"
description = "Agentic copilot for aircraft engine maintenance: LangGraph agents, MCP tools, A2A and AG-UI, deployed on AWS (Bedrock, Lambda)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jean Direl" }]
requires-python = ">=3.11"
keywords = ["agents", "llm", "mcp", "a2a", "ag-ui", "aws", "bedrock", "predictive-maintenance", "c-mapss", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
agents = ["langgraph>=0.2", "langchain-aws>=0.2"]
protocols = ["mcp>=2.2,<3", "a2a-sdk>=0.2", "ag-ui-protocol>=0.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=2.2,<3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff==0.17.0", "pre-commit>=3.7"]

[project.urls]
Repository = "https://github.com/jeandirel/aeromro-agentic-copilot"

[tool.hatch.build.targets.wheel]
packages = ["src/aeromro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
