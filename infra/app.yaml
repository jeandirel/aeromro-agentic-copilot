AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AeroMRO Agentic Copilot - API on AWS Lambda (container image behind the Lambda Web Adapter),
  public function URL, Amazon Bedrock for the language model, logs, alarms and a dashboard.
  Deployed by .github/workflows/deploy.yml with the role created by infra/bootstrap.yaml.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI (immutable tag) built by the deploy workflow
  LlmProvider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, mock]
  BedrockModelId:
    Type: String
    Default: eu.amazon.nova-2-lite-v1:0
    Description: Model or inference profile id enabled in this account and region
  DemoAccessCode:
    Type: String
    Default: ""
    NoEcho: true
    Description: If set, POST /ask requires it in the X-Access-Code header
  CorsOrigins:
    Type: String
    Default: "*"
  AskRateLimitPerMinute:
    Type: Number
    Default: 10
    MinValue: 1
  MemorySize:
    Type: Number
    Default: 2048
    AllowedValues: [512, 1024, 1536, 2048]

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/aeromro-api
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aeromro-app-api
      PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/aeromro-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogGroup.Arn}"
              - Sid: CallBedrockModels
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aeromro-api
      Description: AeroMRO Agentic Copilot API
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt ApiRole.Arn
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          AEROMRO_LLM_PROVIDER: !Ref LlmProvider
          AEROMRO_BEDROCK_MODEL_ID: !Ref BedrockModelId
          AEROMRO_AWS_REGION: !Ref AWS::Region
          AEROMRO_DEMO_ACCESS_CODE: !Ref DemoAccessCode
          AEROMRO_CORS_ORIGINS: !Ref CorsOrigins
          AEROMRO_ASK_RATE_LIMIT_PER_MINUTE: !Ref AskRateLimitPerMinute

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE
      InvokeMode: BUFFERED

  # Public function URLs need both permissions; the second one only through the URL.
  ApiUrlInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiUrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: aeromro-api-errors
      AlarmDescription: The API returned Lambda errors (crashes or timeouts) in the last 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: aeromro-api-throttles
      AlarmDescription: Requests were throttled (account concurrency limit reached)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: aeromro-api
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Invocations and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
               "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}"],
                           [".", "Errors", ".", "."], [".", "Throttles", ".", "."]]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Duration p50 / p95 (ms)", "region": "${AWS::Region}", "period": 300,
               "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", {"stat": "p50"}],
                           ["...", {"stat": "p95"}]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "Concurrent executions", "region": "${AWS::Region}", "stat": "Maximum", "period": 300,
               "metrics": [["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${ApiFunction}"]]}}
          ]
        }

Outputs:
  ApiUrl:
    Description: Public URL of the API
    Value: !GetAtt ApiUrl.FunctionUrl
  FunctionName:
    Value: !Ref ApiFunction
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/aeromro-api
