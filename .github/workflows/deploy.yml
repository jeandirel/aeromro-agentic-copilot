name: Deploy

# Builds the API image with the latest models from the registry (S3), pushes it to ECR and
# deploys infra/app.yaml. AWS access goes through OpenID Connect: no AWS keys are stored in GitHub.
# Requires the repository variable AWS_DEPLOY_ROLE_ARN (output of infra/bootstrap.yaml).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements/runtime.txt"
      - "Dockerfile.lambda"
      - "infra/app.yaml"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  STACK_NAME: aeromro-app
  REPOSITORY: aeromro-api

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (pinned runtime versions)
        run: |
          pip install -r requirements/runtime.txt
          pip install --no-deps -e .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Fetch the latest models from the registry
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="aeromro-artifacts-${ACCOUNT}-${AWS_REGION}"
          VERSION=$(aws s3 cp "s3://${BUCKET}/models/latest.txt" - 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
            echo "::error::No model in s3://${BUCKET}/models/. Run the 'Train RUL model' workflow first."
            exit 1
          fi
          aws s3 sync "s3://${BUCKET}/models/${VERSION}/" models/ --exclude "*" --include "rul_*"
          aws s3 sync "s3://${BUCKET}/models/${VERSION}/data/" data/raw/CMAPSSData/ || true
          echo "MODEL_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: In-service engines (from the model bundle, else NASA with retries and mirror)
        run: |
          if ls data/raw/CMAPSSData/test_FD00*.txt >/dev/null 2>&1; then
            echo "in-service engines taken from the model bundle"
          else
            python -m aeromro.data.download --dest data/raw/CMAPSSData
          fi
      - name: Check that every model loads and scores its fleet
        run: |
          python - <<'EOF'
          from aeromro.fleet import FleetService
          fleet = FleetService("data/raw/CMAPSSData", "models")
          subsets = fleet.available_subsets()
          assert subsets == ["FD001", "FD002", "FD003", "FD004"], subsets
          for s in subsets:
              print(s, len(fleet.fleet(s)), "engines scored")
          EOF
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image
        run: |
          TAG="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${REPOSITORY}:${TAG}"
          docker build -f Dockerfile.lambda -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
      - name: Deploy the stack
        env:
          DEMO_ACCESS_CODE: ${{ secrets.AEROMRO_DEMO_ACCESS_CODE }}
          BEDROCK_MODEL_ID: ${{ vars.AEROMRO_BEDROCK_MODEL_ID || 'eu.amazon.nova-2-lite-v1:0' }}
          CORS_ORIGINS: ${{ vars.AEROMRO_CORS_ORIGINS || '*' }}
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/app.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${IMAGE}" \
              "BedrockModelId=${BEDROCK_MODEL_ID}" \
              "DemoAccessCode=${DEMO_ACCESS_CODE}" \
              "CorsOrigins=${CORS_ORIGINS}"
      - name: Smoke test
        env:
          DEMO_ACCESS_CODE: ${{ secrets.AEROMRO_DEMO_ACCESS_CODE }}
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          URL="${URL%/}"
          echo "API_URL=${URL}" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5; do curl -fsS "${URL}/health" && break || sleep 10; done
          curl -fsS "${URL}/fleets/FD001/engines?status=inspect_now" | head -c 600; echo
          # MCP endpoint: one tool call through the harness gateway.
          curl -fsS -X POST "${URL}/mcp" -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" -H "Mcp-Protocol-Version: 2025-06-18" \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": "estimate_rul", "arguments": {"subset": "FD001", "unit": 81}}}' \
            | python -c "import json,sys; r=json.load(sys.stdin)['result']; assert not r['isError'], r; print('mcp ok', r['structuredContent']['engine'])"
          # /ask answers either from the model or from the fallback, never with an error.
          ASK=$(curl -fsS -X POST "${URL}/ask" -H "Content-Type: application/json" \
            -H "X-Access-Code: ${DEMO_ACCESS_CODE}" \
            -d '{"subset": "FD001", "unit": 81, "question": "Should this engine be inspected?"}')
          echo "$ASK" | python -c "import json,sys; b=json.load(sys.stdin); print('ask ok, model:', b['usage']['model'], '| fallback:', b['fallback_reason']); print(b['answer'][:300])"
          FALLBACK=$(echo "$ASK" | python -c "import json,sys; print(json.load(sys.stdin)['fallback_reason'] or 'none')")
          echo "LLM_FALLBACK=${FALLBACK}" >> "$GITHUB_ENV"
          {
            echo "### Deployed"
            echo "- API: ${URL}"
            echo "- Image: \`${IMAGE}\`"
            echo "- Models: \`${MODEL_VERSION}\`"
            echo "- Language model fallback: \`${FALLBACK}\` (none means Bedrock answered)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record the deployment on GitHub (link shown on the repository page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(jq -n --arg ref "$GITHUB_SHA" \
            '{ref: $ref, environment: "production", auto_merge: false, required_contexts: [],
              description: "AWS Lambda, eu-west-3"}' \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)
          jq -n --arg url "$API_URL" \
            --arg log "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg desc "smoke test passed; LLM fallback: ${LLM_FALLBACK:-unknown}" \
            '{state: "success", environment_url: $url, log_url: $log, description: $desc}' \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses" --input -
