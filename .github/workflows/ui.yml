name: AeroMRO UI
on:
  pull_request:
    paths:
      - index.html
      - styles.css
      - app.js
      - api/**
      - vercel.json
      - package.json
      - .github/workflows/ui.yml
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - api/**
      - vercel.json
      - package.json
      - .github/workflows/ui.yml

permissions:
  contents: read

jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: npm run test:ui
      - name: Verify entrypoint and API gateway
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f api/proxy.js
          grep -q 'data-section="overview"' index.html
          grep -q 'data-section="fleet"' index.html
          grep -q 'data-section="assistant"' index.html
          grep -q 'data-section="audit"' index.html
          grep -q 'NASA C-MAPSS' index.html
          grep -q 'AEROMRO_API_BASE_URL' api/proxy.js
