name: Build interface imagery

# Downloads the NASA photographs listed in scripts/images.manifest.json, optimises them
# (AVIF / WebP, responsive widths, blur placeholder) and commits the result to the same branch.
# Runs only on feature branches, only when the manifest or the script changes.
on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/images.manifest.json
      - scripts/build-images.mjs

permissions:
  contents: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install sharp (not a project dependency)
        run: |
          mkdir -p /tmp/sharp && cd /tmp/sharp && npm init -y >/dev/null && npm install sharp@0.35.5 >/dev/null
          echo "NODE_PATH=/tmp/sharp/node_modules" >> "$GITHUB_ENV"
      - name: Build images
        run: |
          ln -s /tmp/sharp/node_modules node_modules
          node scripts/build-images.mjs
          rm node_modules
      - name: Commit the optimised images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in .image-candidates public/images src/content; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(images): build optimised NASA imagery"
          git push origin HEAD:${{ github.ref_name }}
